name: Mingyue Stock v4.7 stock ownership fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v47-stock-sync-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect stock data from player sync
        shell: python
        run: |
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = '''                stocks:\n                    stocks,\n\n'''
          if old in s:
              s = s.replace(old, '', 1)
          s = s.replace('const SYSTEM_VERSION = "4.2";', 'const SYSTEM_VERSION = "4.7";', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add script.js
          git commit -m 'fix: protect stock data from player sync'
          git push
