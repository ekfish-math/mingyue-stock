name: Secure Mingyue v4.6 funds
on:
  push:
    branches: [agent/v46-financial-admin]
    paths: ['script.js']
permissions:
  contents: write
jobs:
  secure-funds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace v4.5 fund module with approval flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          marker='/* =========================================================\n   v4.5 證券帳戶資金模組'
          i=s.find(marker)
          if i < 0: raise SystemExit('fund module marker not found')
          module=r'''/* =========================================================
   v4.6 證券帳戶資金模組
   ---------------------------------------------------------
   正數：建立儲值申請，不直接增加餘額
   負數：建立提領申請，凍結金額，不直接出款
   後台核准：完成資金異動
   後台駁回：解除凍結
   ========================================================= */
          (function () {
              "use strict";
              const FUND_STORAGE_KEY="mingyue_fund_transactions_v46";
              const WITHDRAWAL_STORAGE_KEY="mingyue_withdrawal_requests_v46";
              const DEPOSIT_STORAGE_KEY="mingyue_deposit_requests_v46";
              let fundTransactions=loadData(FUND_STORAGE_KEY,[]); if(!Array.isArray(fundTransactions)) fundTransactions=[];
              let withdrawalRequests=loadData(WITHDRAWAL_STORAGE_KEY,[]); if(!Array.isArray(withdrawalRequests)) withdrawalRequests=[];
              let depositRequests=loadData(DEPOSIT_STORAGE_KEY,[]); if(!Array.isArray(depositRequests)) depositRequests=[];
              user.frozenBalance=Math.max(0,Number(user.frozenBalance)||0);
              function id(p){return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);}
              function persist(){saveData(FUND_STORAGE_KEY,fundTransactions);saveData(WITHDRAWAL_STORAGE_KEY,withdrawalRequests);saveData(DEPOSIT_STORAGE_KEY,depositRequests);saveData("mingyue_user_v42",user);if(firebaseReady)update(ref(db),{["users/"+user.accountId]:user,["fundTransactions/"+user.accountId]:fundTransactions,["withdrawalRequests/"+user.accountId]:withdrawalRequests,["depositRequests/"+user.accountId]:depositRequests}).catch(console.error);}
              function msg(x){if(typeof window.showToast==="function")window.showToast(x);else console.log(x);}
              function refresh(){const x=money(user.balance);document.querySelectorAll("#balance,#user-balance,#asset-balance,[data-user-balance],.user-balance,.asset-balance").forEach(e=>e.textContent=x);}
              async function changeBalance(amount){amount=Number(amount);if(!Number.isFinite(amount)||amount===0){msg("請輸入非 0 的有效金額");return {ok:false};}
                const now=Date.now();
                if(amount>0){const r={id:id("DEP"),accountId:String(user.accountId),amount,status:"pending",type:"deposit",createdAt:now};depositRequests.unshift(r);fundTransactions.unshift(r);persist();msg("儲值申請已送出，等待後台審核");return {ok:true,record:r};}
                const a=Math.abs(amount),available=Math.max(0,(Number(user.balance)||0)-(Number(user.frozenBalance)||0));if(a>available){msg("提領失敗：可用餘額不足");return {ok:false};}
                user.frozenBalance=(Number(user.frozenBalance)||0)+a;const r={id:id("WDR"),accountId:String(user.accountId),amount:a,status:"pending",type:"withdrawal",createdAt:now,frozenAfter:user.frozenBalance};withdrawalRequests.unshift(r);fundTransactions.unshift(r);persist();msg("提領申請已送出，¥"+a.toLocaleString("zh-TW")+" 已凍結，等待後台審核");return {ok:true,record:r};}
              function open(){let m=document.getElementById("securities-fund-modal");if(!m){m=document.createElement("div");m.id="securities-fund-modal";m.style.cssText="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:20px";m.innerHTML='<div style="background:#fff;padding:22px;border-radius:18px;width:min(420px,100%)"><h2>證券帳戶資金</h2><div id="fund-current"></div><input id="fund-amount" type="number" step="0.01" placeholder="正數儲值／負數提領" style="width:100%;padding:12px;box-sizing:border-box"><p style="font-size:12px;color:#777">所有儲值與提領都必須經金融後台審核。</p><button id="fund-ok">送出申請</button> <button id="fund-cancel">取消</button></div>';document.body.appendChild(m);document.getElementById("fund-cancel").onclick=()=>m.remove();document.getElementById("fund-ok").onclick=async()=>{const r=await changeBalance(document.getElementById("fund-amount").value);if(r.ok)m.remove();};}document.getElementById("fund-current").textContent="可用餘額："+money(Math.max(0,(Number(user.balance)||0)-(Number(user.frozenBalance)||0)))+"｜凍結："+money(user.frozenBalance);}
              window.changeSecuritiesBalance=changeBalance;window.openSecuritiesFundModal=open;window.MingyueSecuritiesFunds=Object.freeze({changeBalance:changeBalance,open:open,getBalance:()=>Number(user.balance)||0,getFrozenBalance:()=>Number(user.frozenBalance)||0,getWithdrawals:()=>withdrawalRequests.slice(),getDeposits:()=>depositRequests.slice()});refresh();
          })();
          '''
          p.write_text(s[:i]+module,encoding='utf-8')
          PY
      - name: Commit secure module
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: require financial admin approval for funds'
          git push
