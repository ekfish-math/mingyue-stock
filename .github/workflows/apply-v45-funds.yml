name: Restore Mingyue core player files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v45-funds.yml'

permissions:
  contents: write

jobs:
  restore-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full v4.5 core files
        run: |
          git checkout c7e7750a6488b6eea7ea3634ca2fb8097a30563c -- script.js admin.js
          python3 <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* =========================================================\n   v4.5 證券帳戶資金模組'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n'
          s = s.replace('const SYSTEM_VERSION = "4.5";', 'const SYSTEM_VERSION = "4.6";')
          s = s.replace('const SYSTEM_VERSION = \'4.5\';', "const SYSTEM_VERSION = '4.6';")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit restored core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js admin.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore Mingyue player core and admin module'
          git push
