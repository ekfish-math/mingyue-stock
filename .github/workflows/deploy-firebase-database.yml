name: Deploy Firebase Realtime Database Rules

on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-database-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Realtime Database Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only database --project mingyue-stock --token "$FIREBASE_TOKEN"
