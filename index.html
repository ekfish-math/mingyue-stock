<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>明月證券｜明月帝國證券交易所</title>

  <!-- CSS -->
<link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="app">

    <!-- ==============================
         頂部
    =============================== -->
    <header class="topbar">
      <div>
        <div class="brand">明月證券</div>
        <div class="subtitle">明月帝國證券交易所</div>
      </div>

      <div class="top-balance" id="top-balance">
        ¥1,000,000
      </div>
    </header>


    <!-- ==============================
         主要內容
    =============================== -->
    <main>

      <!-- ============================
           首頁
      ============================= -->
      <section id="page-home" class="page active">

        <div class="hero-card">
          <div class="eyebrow">明月綜合指數</div>

          <div
            id="index-value"
            class="index-value"
          >
            12,584.32
          </div>

          <div class="positive">
            ▲ +1.37%
          </div>
        </div>


        <!-- 市場統計 -->
        <div class="stats-grid">

          <div class="stat-card">
            <span>上市／已登錄企業</span>
            <strong id="stat-companies">4</strong>
          </div>

          <div class="stat-card">
            <span>上漲</span>
            <strong id="stat-up">0</strong>
          </div>

          <div class="stat-card">
            <span>下跌</span>
            <strong id="stat-down">0</strong>
          </div>

          <div class="stat-card">
            <span>成交量</span>
            <strong id="stat-volume">0</strong>
          </div>

        </div>


        <!-- 我的資產 -->
        <div class="section-title-row">
          <h2>我的資產</h2>

          <button
            class="small-btn"
            onclick="openDepositModal()"
          >
            ＋ 儲值
          </button>
        </div>


        <div class="asset-card">

          <div>
            <span>證券餘額</span>

            <strong id="home-assets">
              ¥1,000,000
            </strong>
          </div>

          <div>
            <span>遊戲錢包</span>

            <strong id="home-wallet">
              ¥500,000
            </strong>
          </div>

        </div>


        <!-- 今日熱門 -->
        <h2>今日熱門</h2>

        <div
          id="home-hot-stocks"
          class="stock-list"
        ></div>

      </section>



      <!-- ============================
           行情
      ============================= -->
      <section id="page-market" class="page">

        <h1>📈 行情</h1>

        <div class="tabs">

          <button
            class="market-tab active"
            onclick="filterMarket('all', this)"
          >
            全部
          </button>

          <button
            class="market-tab"
            onclick="filterMarket('up', this)"
          >
            上漲
          </button>

          <button
            class="market-tab"
            onclick="filterMarket('down', this)"
          >
            下跌
          </button>

        </div>


        <div
          id="market-list"
          class="stock-list"
        ></div>

      </section>



      <!-- ============================
           股票詳細
      ============================= -->
      <section id="page-stock" class="page">

        <button
          class="back-btn"
          onclick="showPage('market')"
        >
          ← 返回行情
        </button>

        <div id="stock-detail"></div>

      </section>



      <!-- ============================
           投資
      ============================= -->
      <section id="page-portfolio" class="page">

        <h1>💼 我的投資</h1>


        <div class="balance-card">

          <span>證券餘額</span>

          <strong id="portfolio-balance">
            ¥1,000,000
          </strong>

          <button
            onclick="openDepositModal()"
          >
            儲值
          </button>

        </div>


        <h2>我的持股</h2>

        <div
          id="portfolio-list"
          class="simple-list"
        ></div>


        <h2>交易紀錄</h2>

        <div
          id="transaction-list"
          class="simple-list"
        ></div>

      </section>



      <!-- ============================
           新聞
      ============================= -->
      <section id="page-news" class="page">

        <h1>📰 新聞</h1>


        <div class="tabs">

          <button
            class="news-tab active"
            onclick="filterNews('all', this)"
          >
            全部
          </button>

          <button
            class="news-tab"
            onclick="filterNews('company', this)"
          >
            企業新聞
          </button>

        </div>


        <div
          id="news-list"
          class="news-list"
        ></div>

      </section>



      <!-- ============================
           個人
      ============================= -->
      <section id="page-profile" class="page">

        <h1>👤 個人</h1>


        <div class="profile-card">

          <div class="avatar">
            F
          </div>

          <div>

            <h2 id="profile-name">
              Fisher
            </h2>

            <p id="profile-account">
              MYS-000184
            </p>

          </div>

        </div>


        <!-- Google 認證 -->
        <button
          class="menu-card"
          onclick="googleLogin()"
        >
          <span>🔐 Google 實名認證</span>
          <span>Demo</span>
        </button>


        <!-- 註冊公司 -->
        <button
          class="menu-card"
          onclick="openCompanyModal()"
        >
          <span>🏢 註冊公司</span>
          <span>›</span>
        </button>


        <!-- 我的公司 -->
        <button
          class="menu-card"
          onclick="openMyCompany()"
        >
          <span>🏭 我的公司</span>
          <span>›</span>
        </button>

      </section>



      <!-- ============================
           我的公司
      ============================= -->
      <section id="page-company" class="page">

        <button
          class="back-btn"
          onclick="showPage('profile')"
        >
          ← 返回個人
        </button>


        <div id="company-page"></div>

      </section>

    </main>



    <!-- ==============================
         底部導航
    =============================== -->
    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-page="home"
        onclick="showPage('home')"
      >
        <span>🏠</span>
        <small>首頁</small>
      </button>


      <button
        class="nav-item"
        data-page="market"
        onclick="showPage('market')"
      >
        <span>📈</span>
        <small>行情</small>
      </button>


      <button
        class="nav-item"
        data-page="portfolio"
        onclick="showPage('portfolio')"
      >
        <span>💼</span>
        <small>投資</small>
      </button>


      <button
        class="nav-item"
        data-page="news"
        onclick="showPage('news')"
      >
        <span>📰</span>
        <small>新聞</small>
      </button>


      <button
        class="nav-item"
        data-page="profile"
        onclick="showPage('profile')"
      >
        <span>👤</span>
        <small>我的</small>
      </button>

    </nav>

  </div>



  <!-- ==============================
       儲值 Modal
  =============================== -->
  <div
    id="deposit-modal"
    class="modal"
  >

    <div class="modal-box">

      <button
        class="close"
        onclick="closeModal('deposit-modal')"
      >
        ×
      </button>


      <h2>💰 儲值到證券系統</h2>

      <p>
        從遊戲錢包轉入證券餘額。
      </p>


      <input
        id="deposit-amount"
        type="number"
        min="1"
        placeholder="輸入金額"
      >


      <button
        class="primary-btn"
        onclick="depositMoney()"
      >
        確認儲值
      </button>

    </div>

  </div>



  <!-- ==============================
       註冊公司 Modal
  =============================== -->
  <div
    id="company-modal"
    class="modal"
  >

    <div class="modal-box">

      <button
        class="close"
        onclick="closeModal('company-modal')"
      >
        ×
      </button>


      <h2>🏢 註冊公司</h2>


      <input
        id="company-name"
        type="text"
        placeholder="公司完整名稱"
      >


      <input
        id="company-short"
        type="text"
        placeholder="公司簡稱"
      >


      <input
        id="company-code"
        type="text"
        placeholder="股票代號，例如 ABC"
      >


      <select id="company-industry">

        <option value="科技">
          科技
        </option>

        <option value="金融">
          金融
        </option>

        <option value="工業">
          工業
        </option>

        <option value="交通">
          交通
        </option>

        <option value="醫療">
          醫療
        </option>

        <option value="餐飲">
          餐飲
        </option>

        <option value="農林">
          農林
        </option>

        <option value="能源">
          能源
        </option>

        <option value="教育">
          教育
        </option>

        <option value="其他">
          其他
        </option>

      </select>


      <input
        id="company-capital"
        type="number"
        min="1"
        placeholder="註冊資本"
      >


      <button
        class="primary-btn"
        onclick="registerCompany()"
      >
        完成註冊
      </button>

    </div>

  </div>



  <!-- ==============================
       Toast
  =============================== -->
  <div
    id="toast"
    class="toast"
  ></div>



  <!-- ==============================
       JavaScript
  =============================== -->

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 明月證券 JavaScript -->
  <script src="script.js"></script>

</body>
</html>
