<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>明月證券</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ================================= -->
    <!-- APP -->
    <!-- ================================= -->

    <div id="app">


        <!-- ================================= -->
        <!-- 首頁 -->
        <!-- ================================= -->

        <main
            id="home-page"
            class="page"
        >

            <header class="app-header">

                <h1>
                    明月證券
                </h1>

                <p>
                    明月帝國證券交易所
                </p>

            </header>


            <!-- 明月指數 -->

            <section class="card">

                <p>
                    明月綜合指數
                </p>

                <h2>
                    12,584.32
                </h2>

                <span class="up">
                    ▲ +1.37%
                </span>

            </section>


            <!-- 我的資產 -->

            <section class="card">

                <p>
                    我的資產
                </p>

                <h2 id="cash-display">
                    ¥ 1,000,000.00
                </h2>

            </section>


            <!-- 今日熱門 -->

            <section>

                <h2>
                    今日熱門
                </h2>

                <div id="stock-list">

                    <!-- JavaScript 自動產生股票 -->

                </div>

            </section>

        </main>


        <!-- ================================= -->
        <!-- 股票詳細頁 -->
        <!-- ================================= -->

        <main
            id="stock-detail"
            class="page"
            style="display:none;"
        >

            <!-- JavaScript 自動產生 -->

        </main>


        <!-- ================================= -->
        <!-- 我的投資 -->
        <!-- ================================= -->

        <main
            id="investment-page"
            class="page"
            style="display:none;"
        >

            <!-- JavaScript 自動產生 -->

        </main>


        <!-- ================================= -->
        <!-- 交易紀錄 -->
        <!-- ================================= -->

        <main
            id="transaction-page"
            class="page"
            style="display:none;"
        >

            <!-- JavaScript 自動產生 -->

        </main>


        <!-- ================================= -->
        <!-- 新聞 -->
        <!-- ================================= -->

        <main
            id="news-page"
            class="page"
            style="display:none;"
        >

            <!-- JavaScript 自動產生 -->

        </main>


        <!-- ================================= -->
        <!-- 底部導航 -->
        <!-- ================================= -->

        <nav class="bottom-nav">


            <!-- 首頁 -->

            <button
                id="home-button"
                class="nav-button"
                type="button"
            >

                <span class="nav-icon">
                    🏠
                </span>

                <span>
                    首頁
                </span>

            </button>


            <!-- 行情 -->

            <button
                id="market-button"
                class="nav-button"
                type="button"
            >

                <span class="nav-icon">
                    📈
                </span>

                <span>
                    行情
                </span>

            </button>


            <!-- 投資 -->

            <button
                id="investment-button"
                class="nav-button"
                type="button"
            >

                <span class="nav-icon">
                    💼
                </span>

                <span>
                    投資
                </span>

            </button>


            <!-- 新聞 -->

            <button
                id="news-button"
                class="nav-button"
                type="button"
            >

                <span class="nav-icon">
                    📰
                </span>

                <span>
                    新聞
                </span>

            </button>


            <!-- 我的 -->

            <button
                id="profile-button"
                class="nav-button"
                type="button"
            >

                <span class="nav-icon">
                    👤
                </span>

                <span>
                    我的
                </span>

            </button>


        </nav>


    </div>


    <!-- ================================= -->
    <!-- JavaScript -->
    <!-- ================================= -->

    <script
        src="script.js"
    ></script>


</body>

</html>
